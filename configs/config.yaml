# Model Configuration
model:
  name: "clip-vit-base-patch32"
  pretrained: "openai/clip-vit-base-patch32"
  image_size: 224
  max_text_length: 77
  temperature: 0.07
  projection_dim: 512

# Data Configuration
data:
  batch_size: 32
  num_workers: 4
  image_dir: "data/images"
  text_file: "data/annotations.json"
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  max_samples: 1000  # For toy dataset

# Training Configuration
training:
  epochs: 10
  learning_rate: 1e-4
  weight_decay: 0.01
  warmup_steps: 100
  gradient_clip_norm: 1.0
  mixed_precision: true
  save_every_n_epochs: 2

# Evaluation Configuration
evaluation:
  metrics: ["recall@1", "recall@5", "recall@10", "map", "median_rank"]
  k_values: [1, 5, 10]
  batch_size: 64

# Hardware Configuration
device: "auto"  # auto, cuda, mps, cpu
seed: 42
deterministic: true

# Logging Configuration
logging:
  level: "INFO"
  log_dir: "logs"
  save_predictions: true
  save_attention_maps: true

# Demo Configuration
demo:
  max_results: 10
  show_attention: true
  port: 8501
